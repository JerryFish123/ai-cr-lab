services:
  mysql:
    image: mysql:8.0
    # 账号/库名/密码全部来自 conf/.env（勿再用 host 插值覆盖，以免不一致）
    env_file:
      - ./conf/.env
    environment:
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --explicit_defaults_for_timestamp=1
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-cr-lab:local
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./data:/app/data
      - ./log:/app/log
      - ./conf/.env:/app/conf/.env:ro
    env_file:
      - ./conf/.env
    environment:
      # 容器网络内固定连 compose 服务名；其余账号库名来自 conf/.env
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
